name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/package.py check
      - run: python tools/docs.py check
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s evals/context -p "test_*.py" -v
      - if: runner.os != 'Windows'
        run: python -B -m unittest discover -s skills/sdd-workflow-router/tests -v
      - run: python tools/package.py build
  native-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pinned upstream discovery runtimes in isolation
        env:
          SDD_NATIVE_PREFIX: ${{ runner.temp }}/sdd-native
        run: npm install --prefix "$SDD_NATIVE_PREFIX" --ignore-scripts skills@1.7.4 @deepseek-ai/cordis@4.0.5 @deepseek-ai/dsh-skill@0.2.1-rc.2 @deepseek-ai/dsh-skill-filesystem@0.2.1-rc.2 @earendil-works/pi-coding-agent@0.86.1
      - name: Verify shared installation and native skill discovery
        env:
          SDD_NATIVE_PREFIX: ${{ runner.temp }}/sdd-native
        run: node tests/native_agents.mjs "$SDD_NATIVE_PREFIX" "$SDD_NATIVE_PREFIX/node_modules/@earendil-works/pi-coding-agent"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:adapters
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SDD_BROWSER_CHANNEL: chromium
      - run: npm run test:forward-browser
        env:
          SDD_BROWSER_CHANNEL: chromium
